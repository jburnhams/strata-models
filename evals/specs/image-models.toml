name = "image-models"
question = "Which local model, and which prompt expansion before it, should serve image-generate at 1 MP?"
role = "image-generate"
dataset = "image-prompts-20"
metrics = ["judged", "latency_s", "peak_vram_gb", "failed"]
judge = true                 # quality is judged blind, pair by pair, on the Judge tab: there is no reference picture. Pipelines show only the picture.

# Round 1 (2026-11-09, report in the docs repo): raw prompts, FLUX.3 Klein beat Qwen-Image 2.1 Turbo 14-2-4. Round 2: a text model first turns
# the short prompt into a detailed caption. FLUX.3 Klein's model card says to always do this ("a short prompt sent as typed gives generic
# output") and ships its own upsampler, a Qwen3.5-9B fine-tune (flux3-klein-pup). The other candidates ask: does the fine-tune matter (the
# same system prompt on plain Qwen3.5-9B and Gemma 4 12B), and which way of asking for the expansion works best.
[decision]
primary = "judged"           # head to head with flux3-klein on raw prompts; ties count half
baseline = "flux3-klein"
min_effect = 0.1             # win at least 60 % of the pairs with the baseline
guards = { peak_vram_gb = 1.5, latency_s = 2.0 }

[[candidates]]
name = "flux3-klein"
model = "flux3-klein"
params = { width = 1024, height = 1024 }
note = "16 steps, Q4 (UD-Q4_K_XL); the prompt as typed"

[[candidates]]
name = "qwen-image-2.1-turbo"
model = "qwen-image-2.1-turbo"
params = { width = 1024, height = 1024 }
note = "8 steps, Q4_K_M, text encoder on the CPU; the prompt as typed"

[[candidates]]
name = "pup+flux3-klein"
model = "flux3-klein"
params = { width = 1024, height = 1024 }
note = "BFL's own pipeline: their upsampler and system prompt, greedy, as the reference code runs it"
[[candidates.stages]]
role = "text"
model = "flux3-klein-pup"
params = { system_preset = "image-prompt-bfl", max_tokens = 3584, temperature = 0.0 }

[[candidates]]
name = "qwen3.5-bfl+flux3-klein"
model = "flux3-klein"
params = { width = 1024, height = 1024 }
note = "the same system prompt on the general Qwen3.5-9B (the model the upsampler was tuned from)"
[[candidates.stages]]
role = "text"
model = "qwen3.5-9b-vl"
params = { system_preset = "image-prompt-bfl", max_tokens = 3584, temperature = 0.0 }

[[candidates]]
name = "qwen3.5-bfl-think+flux3-klein"
model = "flux3-klein"
params = { width = 1024, height = 1024 }
note = "as above, thinking on: plans the scene before writing it"
[[candidates.stages]]
role = "text"
model = "qwen3.5-9b-vl"
params = { system_preset = "image-prompt-bfl", max_tokens = 8000, temperature = 0.0, think = true }

