name = "shots-vhs"
question = "Which detector and settings should serve shot-boundaries for digitised VHS home video, where the camcorder's stops and starts are the cuts?"
role = "shot-boundaries"
dataset = "vhs-shots"        # scripts/evals/vhs_shots.py: stretches of the tapes with their cuts marked by hand
metrics = ["cut_f1", "cut_miss", "cut_false", "latency_s", "failed"]

# A missed cut joins two shots into one the editor cannot split; a false one splits a shot the editor can join again, so cut_miss is read
# beside the primary. Learned detectors (TransNetV2, PySceneDetect's adaptive detector) are candidates to add once their dependencies are
# agreed; these first ones tune the baseline itself.
[decision]
primary = "cut_f1"
baseline = "ffmpeg-0.3"
min_effect = 0.05            # five points of F1: about one cut in twenty more right
guards = { latency_s = 3.0, failed = 1.0 }

[[candidates]]
name = "ffmpeg-0.3"
model = "ffmpeg-scene-score"
params = { threshold = 0.3 }
note = "what serves shot-boundaries today: scene score at 160 px after yadif"

[[candidates]]
name = "ffmpeg-0.2"
model = "ffmpeg-scene-score"
params = { threshold = 0.2 }
note = "lower threshold: finds cuts between like shots of the same room, at the cost of false cuts on fast pans"

[[candidates]]
name = "ffmpeg-0.4"
model = "ffmpeg-scene-score"
params = { threshold = 0.4 }

[[candidates]]
name = "ffmpeg-0.3-woven"
model = "ffmpeg-scene-score"
params = { threshold = 0.3, deinterlace = false }
note = "no deinterlacing: whether yadif matters at 160 px"

[[candidates]]
name = "ffmpeg-0.3-320"
model = "ffmpeg-scene-score"
params = { threshold = 0.3, width = 320 }
note = "twice the analysis width"
