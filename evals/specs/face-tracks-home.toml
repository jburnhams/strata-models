name = "face-tracks-home"
question = "Which detection rate and tracker should serve face-tracks on real home video and race footage?"
role = "face-tracks"
dataset = "face-tracks-home"  # scripts/evals/face_tracks_labels.py: real clips whose tracks a person named; private, kept in the data directory
metrics = ["id_f1", "track_mixed", "track_split", "track_face_miss", "latency_s", "failed"]

# The labels start from a generous run (10 fps, byte, low thresholds), named by hand. A track that mixes two people hands an app a wrong
# name for everything in it, and a split track only asks for one more click, so track_mixed is read beside the primary. Every candidate gets
# the same shot cuts (the item's `cuts`). Which stills to keep (the quality score: the simple size x sharpness x pose score against a learned
# one such as CR-FIQA) is judged blind in an eval of its own, once a second score is served.
[decision]
primary = "id_f1"
baseline = "fps5-iou-emb"
min_effect = 0.02
guards = { latency_s = 2.0, failed = 1.0 }

[[candidates]]
name = "fps5-iou-emb"
model = "buffalo_l-tracks"
params = { fps = 5, tracker = "iou-emb" }
note = "the served baseline (2026-11-26): first guesses"

[[candidates]]
name = "fps2-iou-emb"
model = "buffalo_l-tracks"
params = { fps = 2, tracker = "iou-emb", max_gap_s = 1.5 }
note = "a fifth of the frames of 10 fps: does the embedding carry tracks across the bigger jumps?"

[[candidates]]
name = "fps10-iou-emb"
model = "buffalo_l-tracks"
params = { fps = 10, tracker = "iou-emb" }

[[candidates]]
name = "fps5-iou"
model = "buffalo_l-tracks"
params = { fps = 5, tracker = "iou" }
note = "position only: how much the embedding check is worth"

[[candidates]]
name = "fps5-byte"
model = "buffalo_l-tracks"
params = { fps = 5, tracker = "byte" }
note = "ByteTrack's second pass: unsure faces (0.3 to 0.5) carry a track on, never start one"

[[candidates]]
name = "fps10-byte"
model = "buffalo_l-tracks"
params = { fps = 10, tracker = "byte" }
