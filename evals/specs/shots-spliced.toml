name = "shots-spliced"
question = "Which detector and settings should serve shot-boundaries, judged on cuts whose times are known because the video was spliced from uncut camera files?"
role = "shot-boundaries"
dataset = "spliced-shots"    # scripts/evals/spliced_shots.py: uncut race files spliced end to end; tags.kind is files, far or near (the hard one)
metrics = ["cut_f1", "cut_miss", "cut_false", "latency_s", "failed"]

# A missed cut joins two shots into one the editor cannot split; a false one splits a shot the editor can join again, so cut_miss is read
# beside the primary, and the `near` items (a jump of a few seconds within one file) beside the rest. Learned detectors (TransNetV2,
# PySceneDetect's adaptive detector) join as venv workers, their libraries in a venv of their own and not in this service's (Jonathan,
# 2026-11-23); these first ones tune the baseline itself. The spliced video is progressive, so deinterlacing is not a candidate here.
[decision]
primary = "cut_f1"
baseline = "ffmpeg-0.3"
min_effect = 0.05            # five points of F1: about one cut in twenty more right
guards = { latency_s = 3.0, failed = 1.0 }

[[candidates]]
name = "ffmpeg-0.3"
model = "ffmpeg-scene-score"
params = { threshold = 0.3 }
note = "what served shot-boundaries before 2026-11-24 (0.2 since, eval shots-vhs): scene score at 160 px after yadif"

[[candidates]]
name = "ffmpeg-0.2"
model = "ffmpeg-scene-score"
params = { threshold = 0.2 }
note = "lower threshold: finds cuts between like shots of the same room, at the cost of false cuts on fast pans"

[[candidates]]
name = "ffmpeg-0.4"
model = "ffmpeg-scene-score"
params = { threshold = 0.4 }

[[candidates]]
name = "ffmpeg-0.3-320"
model = "ffmpeg-scene-score"
params = { threshold = 0.3, width = 320 }
note = "twice the analysis width"

# The rivals (2026-11-24): each at its library's default first. All share the baseline's min_shot_s (0.6 s, strongest cut wins) and
# yadif, so only the detector differs; black stretches come from the same blackdetect in every one.

[[candidates]]
name = "transnetv2-0.5"
model = "transnetv2"
params = { threshold = 0.5 }
note = "TransNet V2 on the GPU at its authors' threshold: a network trained on cuts and dissolves, 48 x 27 px frames, 100 at a time"

[[candidates]]
name = "transnetv2-0.3"
model = "transnetv2"
params = { threshold = 0.3 }
note = "lower threshold: the near cuts, where both sides look alike, may peak below 0.5"

[[candidates]]
name = "transnetv2-cpu"
model = "transnetv2-cpu"
params = { threshold = 0.5 }
note = "the same network on the CPU lane: what not waiting for the GPU costs in latency_s"

[[candidates]]
name = "adaptive-3"
model = "pyscenedetect-adaptive"
params = { threshold = 3.0 }
note = "PySceneDetect's AdaptiveDetector at its default ratio: a frame's difference over its neighbours', so a pan is not a cut"

[[candidates]]
name = "adaptive-2"
model = "pyscenedetect-adaptive"
params = { threshold = 2.0 }

[[candidates]]
name = "content-27"
model = "pyscenedetect-content"
params = { threshold = 27.0 }
note = "PySceneDetect's ContentDetector at its default: HSV and edges, against a fixed threshold"
