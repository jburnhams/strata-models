params = { system_preset = "font-propose-v1", prompt = "Identify the typeface of the printed text in this picture.", max_tokens = 4096 }   # Flash thinks first: at 400 every answer stopped at MAX_TOKENS after ~40 characters
input = "{image}"
send = "image"
into = "candidates"

