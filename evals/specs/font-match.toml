# ---- Model judges: can a model tell which rendering matches the print? -------------------------------------------------------------------------
# Each sees the scanned block, then two renderings of its words (black on white, same size), blind and without the labels, every candidate
# against the baseline. The analysis scores each judge against ink_f1 (the right answer on a pair is the rendering with more ink in common).
[[judges]]
name = "qwen"
kind = "vision"
pairs = "baseline"
reference = false
criteria = "Picture 1 is a block of old printed type. X and Y are the same words re-set in a modern font, to rebuild the page. Prefer the one whose typeface looks more like the printed one: the letter shapes, the contrast between thick and thin strokes, the serifs, the width, the weight, and the size and position of the letters. Ignore paper colour, specks and stains."

[[judges]]
name = "gemma"
kind = "vision"
model = "gemma-4-12b-vl"
pairs = "baseline"
reference = false
criteria = "Picture 1 is a block of old printed type. X and Y are the same words re-set in a modern font, to rebuild the page. Prefer the one whose typeface looks more like the printed one: the letter shapes, the contrast between thick and thin strokes, the serifs, the width, the weight, and the size and position of the letters. Ignore paper colour, specks and stains."

[[judges]]
name = "gemini-flash"
cli = "agy"
model = "gemini-3.8-flash-low"
kind = "vision"
pairs = "baseline"
reference = false
limit = 60
criteria = "Picture 1 is a block of old printed type. X and Y are the same words re-set in a modern font, to rebuild the page. Prefer the one whose typeface looks more like the printed one: the letter shapes, the contrast between thick and thin strokes, the serifs, the width, the weight, and the size and position of the letters. Ignore paper colour, specks and stains."

