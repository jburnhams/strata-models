name = "summarise-prompts"
question = "Across real fiction and nonfiction Library books, which prompt and input format gives Claude Haiku 5.5 the clearest, spoiler-free, balanced (likes & dislikes), untruncated summary?"
role = "summarise"
dataset = "book-summarise-mix-14"
metrics = ["judged", "latency_s", "cost_usd", "failed"]
judge = true

[decision]
primary = "judged"
baseline = "v1-json"
min_effect = 0.1
guards = { failed = 1.0 }

[[judges]]
name = "sonnet"
kind = "text"
model = "claude-sonnet-5-5-api"
pairs = "baseline"
limit = 90
criteria = """Judge which summary is better for a listener browsing their audiobook library:
1. Spoiler-free summary of what the book is about (never reveals plot twists or endings).
2. Clearly covers both what readers/listeners liked AND what they disliked/criticised.
3. Concise, smooth, and readable (one tight paragraph / few lines).
4. Complete and NOT truncated (no cut-off sentences, no stray JSON/headings/preamble)."""

[[candidates]]
name = "v1-json"
model = "claude-haiku-5-5-api"
params = { preset = "summarise-v1", max_tokens = 1500, effort = "low" }
note = "Baseline: raw JSON {context}, effort=low"

[[candidates]]
name = "v2-markdown"
model = "claude-haiku-5-5-api"
params = { preset = "summarise-v2-markdown", max_tokens = 1500, effort = "low" }
note = "Clean Markdown sections + explicit spoiler-free & anti-truncation rules"

[[candidates]]
name = "v3-xml"
model = "claude-haiku-5-5-api"
params = { preset = "summarise-v3-xml", max_tokens = 1500, effort = "low" }
note = "XML-tagged inputs (<book>, <sources>) + numbered rules"

[[candidates]]
name = "v4-system-persona"
model = "claude-haiku-5-5-api"
params = { preset = "summarise-v2-markdown", system_preset = "summarise-system-v1", max_tokens = 1500, effort = "low" }
note = "Markdown inputs + dedicated editor system_preset"

[[candidates]]
name = "v5-tight"
model = "claude-haiku-5-5-api"
params = { preset = "summarise-v5-tight", max_tokens = 1500, effort = "low" }
note = "Ultra-tight 2-3 sentences (~65 words)"

[[candidates]]
name = "v6-structured-json"
model = "claude-haiku-5-5-api"
params = { preset = "summarise-v6-json", max_tokens = 1500, effort = "low" }
note = "Structured JSON (premise, liked, disliked, summary) with schema"
