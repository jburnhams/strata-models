name = "summarise"
question = "Which local or cloud model produces the clearest, most faithful one-paragraph book summary covering what it is about and what listeners like and dislike?"
role = "summarise"
dataset = "book-summarise-8"
metrics = ["judged", "latency_s", "cost_usd", "failed"]
judge = true

[decision]
primary = "judged"
baseline = "claude-opus-5-5"
min_effect = 0.1
guards = { failed = 1.0 }

[[judges]]
name = "sonnet"
kind = "text"
model = "claude-sonnet-5-5-api"
pairs = "baseline"
limit = 80
criteria = "Which summary is clearer, more faithful to the provided synopsis and reviews (no invented facts), covers both what the book is about and what listeners like and dislike, and stays concise (3-4 sentences)?"

