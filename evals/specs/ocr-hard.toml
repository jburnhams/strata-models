# v2 presets add "plain text, no Markdown": haiku-read wrote italics as *asterisks* and flash-lite-read added table rules, which cer_exact counts
# as wrong characters (2026-11-14). The v1 candidates stay for comparison.
[[candidates]]
name = "haiku-read-v2"
model = "claude-haiku-5-5-api"
params = { system_preset = "ocr-read-v2", prompt = "Transcribe this page.", max_tokens = 4096 }

