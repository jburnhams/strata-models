name = "page-layout"
question = "Can a vision model read a scanned book page's layout (its text blocks, their roles and reading order, its ornaments) better than Tesseract's blocks, which is all a rebuilt page has today?"
role = "page-build"
dataset = "page-layout"          # scripts/evals/page_layout.py: 10 whole pages of Ward 1874 and Collier 1828, layout labelled by eye
metrics = ["block_f1", "role_acc", "order_tau", "figure_f1", "page_ink_f1", "latency_s", "cost_usd", "failed"]
judge = true                     # blind: which rebuilt page looks more like the scan
similarity = "image"

[decision]
primary = "block_f1"
baseline = "tesseract"
min_effect = 0.05
guards = { failed = 1.0 }
# Tesseract has no roles (every block is body) and finds no figures, so role_acc and figure_f1 measure what a reader adds over it; block_f1
# and order_tau compare the segmentation itself. page_ink_f1 is context here: a vision model gives no line boxes, so its lines are spread
# evenly over each block and its ink lands worse than Tesseract's measured lines even with a better layout. The rebuild that strata-scan
# wants combines them (a model's blocks and roles, Tesseract's lines): the *-fix candidates below, as in ocr-pages, where a model correcting
# Tesseract beat both. Tesseract's lines go to the model numbered (page-build list_lines), it regroups them and adds the figures
# (page-layout-fix-v1), and page-build draws Tesseract's own lines in its blocks. psm 3 stays: psm 4 and flatten, best for OCR text, found
# fewer blocks (2026-11-14 on these pages: block_f1 psm 3 77%, psm 4 67%, flatten 64%, flatten + psm 4 63%).

[[candidates]]
name = "tesseract"
model = "pagebuild"
note = "the item's Tesseract reading (psm 3) drawn as it is: one body block per Tesseract block, lines in Times at their boxes"

[[candidates]]
name = "qwen-layout"
model = "pagebuild"

[[candidates.stages]]
role = "vision-language"
model = "qwen3.5-9b-vl"
params = { preset = "page-layout-v1", max_tokens = 8192, temperature = 0.0 }
input = "{image}"
send = "image"
into = "layout"

