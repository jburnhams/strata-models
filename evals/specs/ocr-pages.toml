name = "ocr-pages"
question = "On hard pages of old printed books, does cleaning the page before Tesseract, or a vision-language model reading or correcting it, give fewer wrong words than Tesseract on the page as scanned?"
role = "ocr"
dataset = "ocr-pages"            # scripts/evals/ocr_pages.py: 10 hard pages of Ward 1874 and Collier 1828 with hand-typed text
metrics = ["cer", "wer", "latency_s", "failed"]
judge = false

[decision]
primary = "cer"
baseline = "tesseract"
min_effect = 0.005               # half a point of CER: on a 1,800-character page, about nine characters
guards = { failed = 1.0 }        # no latency guard: a page read once and kept can take a minute; the write-up states the cost
# What the vision-language candidates cannot give: boxes. A winner among them would serve the text (and strata-scan keeps Tesseract's
# boxes for the overlay and the searchable PDF), so a VL win means a second pass, not a swap.

# ---- Tesseract on the page as scanned, and with the page cleaned first (runtimes/pageclean.py) ----------------------------------------
[[candidates]]
name = "tesseract"
model = "tesseract-eng"
note = "what strata-scan does today: psm 3, the page as cut"

[[candidates]]
name = "psm4"
model = "tesseract-eng"
params = { psm = 4 }
note = "one column of text of varying sizes: title pages and adverts"

[[candidates]]
name = "flatten"
model = "tesseract-eng"
params = { clean = "flatten" }
note = "diary-study's background division: yellowed paper and shadows to white"

[[candidates]]
name = "denoise"
model = "tesseract-eng"
params = { clean = "denoise" }

[[candidates]]
name = "adaptive"
model = "tesseract-eng"
params = { clean = "adaptive" }
note = "Sauvola binarisation"

[[candidates]]
name = "upscale"
model = "tesseract-eng"
params = { clean = "upscale" }
note = "twice the size: small capitals"

[[candidates]]
name = "flatten-sharpen"
model = "tesseract-eng"
params = { clean = "flatten,sharpen" }

[[candidates]]
name = "flatten-psm4"
model = "tesseract-eng"
params = { clean = "flatten", psm = 4 }

[[candidates]]
name = "flatten-denoise-psm4"
model = "tesseract-eng"
params = { clean = "flatten,denoise", psm = 4 }

# ---- A vision-language model reading the page itself -----------------------------------------------------------------------------------
[[candidates]]
name = "qwen-read"
model = "qwen3.5-9b-vl"
params = { system_preset = "ocr-read-v1", prompt = "Transcribe this page.", max_tokens = 4096, temperature = 0.0 }

[[candidates]]
name = "gemma-read"
model = "gemma-4-12b-vl"
params = { system_preset = "ocr-read-v1", prompt = "Transcribe this page.", max_tokens = 4096, temperature = 0.0 }

# ---- After OCR: Tesseract's text corrected by a vision-language model looking at the page ---------------------------------------------
[[candidates]]
name = "tesseract-qwen-fix"
model = "qwen3.5-9b-vl"
params = { system_preset = "ocr-correct-v1", max_tokens = 4096, temperature = 0.0 }
note = "Tesseract (page as scanned), then Qwen corrects its text against the page"

[[candidates.stages]]
role = "ocr"
model = "tesseract-eng"
input = "{image}"
send = "image"
into = "prompt"

[[candidates]]
name = "flatten-qwen-fix"
model = "qwen3.5-9b-vl"
params = { system_preset = "ocr-correct-v1", max_tokens = 4096, temperature = 0.0 }
note = "Tesseract on the flattened page, then Qwen corrects its text"

[[candidates.stages]]
role = "ocr"
model = "tesseract-eng"
params = { clean = "flatten,sharpen" }
input = "{image}"
send = "image"
into = "prompt"

# ---- Model judges: which one can tell good OCR from bad on a page nobody has typed ---------------------------------------------------------
# Each sees the page and two transcriptions, blind and without the reference (reference = false), and picks the more faithful one; every
# candidate against the baseline (pairs = baseline: 12 pairs a page, not 78). The analysis scores each judge against cer: on each pair the
# right answer is the transcription with fewer character errors. A judge that agrees well is the one to rank settings on a book's other pages.
# qwen and gemma are also candidates (the read and fix ones), so they may favour their own: Gemini is not.
[[judges]]
name = "qwen"
kind = "vision"                  # role judge-vision (qwen3.5-9b-vl)
pairs = "baseline"
reference = false
criteria = "The picture is a page of an old printed book; X and Y are two transcriptions of it. Prefer the one that matches the printed words more exactly, letter for letter, in the page's own order: fewer wrong, missing or invented words and letters. Old spellings, line-end hyphens and line breaks as printed are right, not errors. Ignore layout and spacing."

[[judges]]
name = "gemma"
kind = "vision"
model = "gemma-4-12b-vl"         # a trial of another model serving judge-vision
pairs = "baseline"
reference = false
criteria = "The picture is a page of an old printed book; X and Y are two transcriptions of it. Prefer the one that matches the printed words more exactly, letter for letter, in the page's own order: fewer wrong, missing or invented words and letters. Old spellings, line-end hyphens and line breaks as printed are right, not errors. Ignore layout and spacing."

[[judges]]
name = "gemini-flash"
cli = "agy"                      # Google AI Pro via Antigravity; asked both ways round
model = "gemini-3.8-flash-low"
kind = "vision"
pairs = "baseline"
reference = false
limit = 40                       # pairs per run, to spare the plan: run again for the rest
criteria = "The picture is a page of an old printed book; X and Y are two transcriptions of it. Prefer the one that matches the printed words more exactly, letter for letter, in the page's own order: fewer wrong, missing or invented words and letters. Old spellings, line-end hyphens and line breaks as printed are right, not errors. Ignore layout and spacing."
