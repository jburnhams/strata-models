# ---- the full recipe with every face tried instead of Sonnet's shortlist ----------------------------------------------------------------
# font-match's formal run (2026-11-23): exhaustive fits the ink best (ink_f1 0.889 against Sonnet's 0.869) but names the right class of type
# on only 51 % of real blocks (Sonnet 75 %), at three times the time. Ink rewards fitting as such; the judge says which page looks right.
[[candidates]]
name = "full-every-face"
model = "pagebuild"
params = { snap = 0.1, styles = ["roman", "italic"], crop = true, rules = true, unread = true }

[[candidates.stages]]
role = "page-build"
model = "pagebuild"
params = { list_lines = true }
