[[candidates.stages]]
role = "font-match"
model = "fontfit"
params = { mode = "fit" }
input = "{ocr}"
send = "ocr"
also = ["image"]
answer = "json"
into = "font_fit"

# ---- 4. + one size per block, pictures, rules and print nobody read cut from the scan: the full recipe ------------------------------------
