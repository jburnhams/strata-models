# Kinds of the pictures in three scanned books, labelled by eye (2026-11-28) for eval image-kind; `vectorise = true` marks the 30 that
# eval vectorise-plates redraws (a spread of kinds, near-identical plates left out). Kinds: runtimes/imagekind.py KINDS.
#
# A picture is named by its book and page (the page's position in strata-scan, which is the page of its finished PDF) and its shape
# (width / height): scripts/evals/book_pictures.py matches strata-scan's figures and picture pages to these by page and nearest shape, as a
# page can hold two pictures and a picture page is exported both whole and as its figure. `label` says who labelled it; `note` why a kind
# was hard to choose. Books: w1874 (Ward, Punch and Judy with instructions, 1874), c1828 (Collier and Cruikshank, Punch and Judy, 1828),
# hist (Speaight, Punch and Judy: a history, 1970).

