# Whole pages of the two public-domain books for the `page-layout` eval (scripts/evals/page_layout.py), as the cleaned page should be laid
# out: each page's text blocks in reading order (role, box [x, y, w, h] in the Internet Archive scan's pixels), and its ornaments and short
# decorative rules as figures. Conventions (the same ones preset page-layout-v1 gives the vision models):
# - a block is lines with no extra space between them in about one size of type: running paragraphs are one block, a line in another size
#   or with space round it is its own (title pages and advertisements are mostly one-line blocks); a running head and its folio are two
# - reading order: top to bottom, left to right for blocks side by side
# - figures: ornaments, engravings and short rules standing between blocks; not the page border, the rule under a running head, the
#   library stamp, a printer's signature mark or show-through
# Labelled by Claude while building the eval (2026-11-14): rough boxes drawn from the page, then shrunk to the ink inside them. Check by
# hand before trusting a small difference.

