# Text blocks of the two public-domain books for the `font-match` eval (scripts/evals/font_match.py). Each is cut from an Internet Archive
# scan (book = which scan, leaf = its image number there, box = [x, y, w, h] in that image's pixels) and labelled from the page by eye:
# `classes` the kind(s) of type it is (fonts.toml's classes; the first is the best guess, the rest acceptable: period type is often between
# two), `style` the main style of its words. Labelled by Claude while building the eval (2026-11-14); check by hand before trusting a small
# difference on the class metrics. No exact face is given: these faces mostly do not exist as font files, which is what the synthetic items
# are for.

