name: Upgrade strata-python

# strata-python comes from PyPI within the range in pyproject.toml (>=0.2,<0.3); uv.lock pins the release. This moves the pin to the newest
# release in that range weekly (and on demand; a new 0.N minor is a deliberate edit of the range): it runs the whole gate and the integration tests on it, and only if they pass opens a PR with the lockfile change. The gate runs here because a PR
# opened with the default token does not start the other workflows. Needs Settings > Actions > "Allow GitHub Actions to create pull requests".

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --upgrade-package strata-python
      - id: changed
        run: git diff --quiet uv.lock && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.changed == 'true'
        run: |
          uv sync --locked
          uv run --locked strata-check
          uv run --locked pytest tests/integration -n auto
      - if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upgrade-strata-python
          title: Upgrade strata-python
          commit-message: Upgrade strata-python (uv lock --upgrade-package strata-python)
          body: |
            Moves the strata-python pin in `uv.lock` to its newest PyPI release within the range in `pyproject.toml`. The gate (`strata-check`) and the integration tests passed on it in the workflow run that opened this PR.
