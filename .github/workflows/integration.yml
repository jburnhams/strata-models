name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Tesseract, ffmpeg and potrace (the ocr, shot-boundaries and vectorise runtimes run the real commands in the tests)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr ffmpeg potrace ;;
            macOS) brew install tesseract ffmpeg potrace ;;
            # winget, not Chocolatey: its manifests point at the projects' own GitHub releases (UB Mannheim's Tesseract
            # build, Gyan's ffmpeg), so a community.chocolatey.org outage (504s on 2026-11-25) no longer fails the job.
            # winget changes the machine PATH, which later steps do not see, so the folders go on GITHUB_PATH.
            Windows)
              for pkg in UB-Mannheim.TesseractOCR Gyan.FFmpeg; do
                winget install --id "$pkg" --exact --silent --disable-interactivity --accept-source-agreements --accept-package-agreements || exit 1
              done
              # Gyan's build is a portable zip: winget unpacks it under WinGet\Packages and links it only where symlinks
              # are allowed, so put the folder that holds ffmpeg.exe itself on the PATH.
              ff=$(dirname "$(find "$(cygpath "$LOCALAPPDATA")/Microsoft/WinGet/Packages" -name ffmpeg.exe | head -1)")
              "/c/Program Files/Tesseract-OCR/tesseract.exe" --version && "$ff/ffmpeg.exe" -version | head -1 || exit 1
              echo "C:\Program Files\Tesseract-OCR" >> "$GITHUB_PATH"
              cygpath -w "$ff" >> "$GITHUB_PATH"
              # potrace has no winget package: its author's own Windows build (a zip of potrace.exe), from SourceForge's mirrors
              curl -fsSL --retry 4 -o "$RUNNER_TEMP/potrace.zip" "https://potrace.sourceforge.net/download/1.16/potrace-1.16.win64.zip" || exit 1
              unzip -q "$RUNNER_TEMP/potrace.zip" -d "$RUNNER_TEMP" && "$RUNNER_TEMP/potrace-1.16.win64/potrace.exe" --version | head -1 || exit 1
              cygpath -w "$RUNNER_TEMP/potrace-1.16.win64" >> "$GITHUB_PATH" ;;
          esac
      - run: uv sync --locked
      - name: Integration tests (CLI and HTTP API end-to-end)
        run: uv run pytest tests/integration -n auto --durations=10

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
