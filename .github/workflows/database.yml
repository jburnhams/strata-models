name: Database

# Migrations (strata-db check: from empty, one head, drift, downgrade, stairway) and the database tests on SQLite and on a throwaway
# PostgreSQL 18 service container, with strata_python.db (strata-python's [db] extra, at the version uv.lock pins). The unit workflow runs
# everything else.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18  # Postgres 18 with pgvector: the face store's face_embeddings need the vector extension
        env:
          POSTGRES_PASSWORD: postgres  # throwaway CI container gitleaks:allow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STRATA_DB_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres  # throwaway CI container gitleaks:allow
      STRATA_TEST_PG: "1"  # a Postgres that cannot be reached fails the job instead of skipping
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Migrations on SQLite and Postgres
        run: uv run --locked strata-db check
      - name: Database tests on SQLite
        run: uv run --locked pytest tests/unit/test_database.py tests/unit/test_store.py -o addopts=
      - name: Database tests on Postgres
        run: uv run --locked pytest tests/unit/test_database.py tests/unit/test_store.py -o addopts= --pg
