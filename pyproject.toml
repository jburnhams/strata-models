[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-models"
version = "0.1.0"
description = "One owner for the GPU on this machine: runs models (faces, transcription, image embedding, image generation) for the other apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "numpy",           # evals: statistics and metrics
    "sqlalchemy>=2",
    "psycopg[binary]",
    "omarchy-db",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
strata-models = "stratamodels.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-xdist",
    "diff-cover",
    "ruff",
    "pyright",
    "ty",
]
# The model runtimes (`uv sync --group gpu` on the machine with the GPU). One copy of each, for every app.
gpu = [
    "onnxruntime-gpu==1.23.2; sys_platform != 'darwin'",    # insightface (faces). 1.24+ is built for CUDA 13, while CTranslate2 needs CUDA 12: one set of CUDA 12 libraries serves both
    "insightface",
    "opencv-python-headless",
    "faster-whisper",                                       # transcribe (CTranslate2). Audio is decoded with ffmpeg, not its PyAV decoder (broken by PyAV 15+)
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux'",    # onnxruntime-gpu's CUDA provider also loads these three
    "nvidia-curand-cu12; sys_platform == 'linux'",
    "nvidia-cufft-cu12; sys_platform == 'linux'",
    "torch",                                                # image-embed (open_clip). It brings its own CUDA 13 libraries under nvidia/cu13, which the launcher keeps off the library path
    "open-clip-torch",
]

[tool.uv.sources]
omarchy-db = { git = "https://github.com/jburnhams/database", subdirectory = "python" }

[tool.hatch.build.targets.wheel]
packages = ["src/stratamodels"]

[tool.omarchy-db]
app = "stratamodels"
models = "stratamodels.db.models:Base"
migrations = "migrations"

[tool.pytest.ini_options]
pythonpath = ["tests/utils"]
testpaths = ["tests/unit"]
addopts = "-ra --timeout=300 --strict-markers --strict-config"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]       # TestClient noise from the installed starlette; remove when the dependency moves on
markers = [
    "integration: runs the CLI and HTTP server end-to-end (tests/integration)",
    "slow: slow tests; run manually or on a schedule",
]

[tool.coverage.run]
source = ["src/stratamodels"]
branch = true
omit = ["*/__main__.py", "*/runtimes/faces.py", "*/runtimes/whisper.py"]       # the real runtimes need the GPU stack; they are covered by tests/gpu (run on omarchy: pytest tests/gpu)

[tool.coverage.report]
skip_empty = true
show_missing = false
# Measured from the unit suite only (tests/unit). Ratchet this up as coverage improves.
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = ["E501"]        # the formatter wraps code; long comments and docstrings stay (the house style comments the why)

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Ratchet: files listed here are checked strictly; the rest in basic mode. Add a file when it is fully annotated; never remove one.
strict = []
