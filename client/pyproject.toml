[project]
name = "strata-models-client"
version = "0.1.0"
description = "Ask the strata-models service on this machine to run a model, or to lend you the GPU. Standard library only."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["strata_models_client"]
