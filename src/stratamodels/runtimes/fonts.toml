# The faces the `font-match` role chooses from (runtimes/fontfit.py): open (OFL) fonts on Google Fonts, fetched into <models_dir>/fonts/ on
# first use, so a rebuilt page can embed what was matched. Period type rarely survives as a font file, so each entry has a `class` (what kind
# of letter it is, after Vox-ATypI, with the 19th-century display kinds split out) and the eval scores closeness by class as well as exact
# hits. `like` says what historical type it is close to, for the vision model that proposes candidates; `sc` names a true small-capitals
# family where there is one (otherwise small capitals are made from the capitals at x-height). `weight` picks a heavier cut of the same family
# as its own face (fat faces); the default is 400 with 700 as bold and the italic when the family has them.
#
# Classes: old-style (Garamond, Caslon, Fell: slanted stress, bracketed serifs), transitional (Baskerville, Bell), modern (Didot, Bodoni,
# Scotch Roman and the 19th-century book "moderns": vertical stress, hairline serifs), fat-face (Thorne's heavy display moderns),
# clarendon (bracketed heavy slab, Ionic), slab (Egyptian, square serifs), grotesque (19th-century sans), decorated (Tuscan, ornamented,
# shaded, outline), blackletter, script.

[faces.eb-garamond]
family = "EB Garamond"
class = "old-style"
like = "Garamond, 16th-century French old style"

