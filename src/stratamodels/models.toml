# ---- Cloud APIs -------------------------------------------------------------------------------------------------------------------------
# Models served by a vendor's API with a key of Jonathan's (keys.py: ~/.config/strata-models/secrets.env, chmod 600). Every call is written to
# the ledger (api_calls) and counted against the key's budget (spend.py; settings <key>_budget_usd and <key>_rollover); a call whose worst case
# does not fit what is left is refused before it is sent. None is a role's model: a job names one, or an eval tries it. Prices are USD per
# million tokens from the vendors' pricing pages (Claude: platform.claude.com pricing, 2026-11-03; Gemini: aistudio.google.com/docs/pricing,
# 2026-11-14): update them when the vendor does, the ledger prices each call at the price of its day.

