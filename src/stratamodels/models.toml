# ---- recorded sound: noise out, and how good the result sounds ---------------------------------------------------------------------------
# Moved from strata-360 (audio/dsp.py clean_for_playback, its audio_clean stage). One worker script (stratamodels/workers/audio.py), one venv
# per model family: DeepFilterNet needs its own torch and a patch for torchaudio 2.1+, ClearerVoice pins numpy<2, Resemble Enhance torch 2.1.
# Make them with scripts/setup_worker_venv.sh dfn | clearvoice | resemble | audio. Every engine runs the same chain (high-pass, denoise, an
# optional cap on how much it takes out, an optional speech finish, loudness to -14 LUFS), so candidates differ only where they should.
[roles.denoise-audio]
description = "Take noise out of recorded sound (wind, hiss, hum, rumble) and keep the speech clear, for listening and for films"
model = "deepfilternet3"                     # strata-360's audio_clean today (capped at 18 dB so the crowd and the place stay); eval denoise-audio decides

[models.deepfilternet3]
runtime = "venv-worker"
name = "DeepFilterNet3"
roles = ["denoise-audio"]
vram_gb = 0.5
licence = "MIT or Apache-2.0"
source = "https://github.com/Rikorose/DeepFilterNet"
used_by = ["strata-360"]
# strata-360's clean_for_playback: high-pass 80 Hz, DeepFilterNet3 capped at 18 dB, speech EQ and speechnorm, -14 LUFS.
options = { worker = "audio", venv = "dfn", engine = "dfn3", defaults = { highpass = 80, atten_lim_db = 18, finish = "strata360", lufs = -14 } }

[models.mossformer2-se-48k]
runtime = "venv-worker"
name = "MossFormer2_SE_48K"
roles = ["denoise-audio"]
vram_gb = 1.5
licence = "Apache-2.0"
source = "https://github.com/modelscope/ClearerVoice-Studio"
used_by = ["strata-360"]                     # its stand-in for DeepFilterNet on Windows, with the same 18 dB cap
options = { worker = "audio", venv = "clearvoice", engine = "clearvoice" }

[models.mossformergan-se-16k]
runtime = "venv-worker"
name = "MossFormerGAN_SE_16K"
roles = ["denoise-audio"]
