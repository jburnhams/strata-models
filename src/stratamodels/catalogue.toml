# The routing catalogue: every backend a job could go to (this machine's GPU and CPU, the subscription CLIs, the API keys), each model it
# offers mapped to roles, power (tier) and cost, so stratamodels.routing can compare local and cloud like with like. The data folder's
# catalogue.toml is merged over this one, table by table (a tariff, a new measured quota, a tier changed after an eval).
#
# Not a second registry: models.toml says what this service runs and how (runtime, VRAM, options, and an API model's `options.price`); this
# file adds what routing needs and the registry does not know. Local models come from the registry (their GPU seconds from the job history);
# a cloud model the registry does not serve yet (a subscription model only recorded for evals) is an `offers` entry here.
#
# Backends:
#   kind        local | subscription | api
#   order       which to spend first when quality is equal (lower first). Jonathan, 2026-11-14: the GPU first, then the free but limited ones
#               (agy, NIM, the free Gemini key) "as much as you like", then codex "fairly sparingly", then the paid keys (Gemini paid only as a
#               fallback after agy; Claude has $100 until 2026-12-08).
#   use         freely | sparingly | fallback | budget: Jonathan's words for it, shown with every option
#   min_left    keep this share of the allowance in reserve: below it the backend is not picked (subscriptions: Jonathan's 10 % rule)
#   allowance   how much is left is read from: agy | codex (their own CLIs, evals.cloud.USAGE) or spend:<provider> (stratamodels.spend, the
#               API keys' own tracking); none: not tracked
#   leaves      true: the inputs (photos, audio) leave this machine. A private job never goes there.
#   plan_usd_month  what the plan costs, to price a call's share of it (usd_equiv): a subscription's marginal cost is nothing until it runs out
#   watts, usd_per_kwh  the local lanes' electricity, for the same reason. Set usd_per_kwh to the real tariff in the data folder's copy.
#   fallback_for  only picked when no option of the same family is left on that backend
#
# Offers (cloud models; keyed by anything, matched to a registry model of the same backend by `model`, the vendor's id, once one exists):
#   backend, model, roles, family (the same model on two backends: claude-sonnet-5-5 on agy and on the API), tier, price (USD per million
#   tokens {in, out}; the registry's options.price wins), quota (share of a bucket per call, measured), evals (registry keys whose eval
#   results stand for this model: the recorded outputs), images/audio (takes them as input), note.
#
# Tiers: 5 frontier, 4 strong, 3 good, 2 the best that fits this GPU, 1 small. A first guess from the vendor's positioning; an eval verdict
# outranks it (routing reads the eval summaries). A local model with no tier (a detector, a vocoder) is compared on evals and cost only.

[defaults]
min_left = 0.10
# Tokens of a typical call per role, to price an API call before it is made (the API keys' spend tracking records the real ones).
tokens = { text = { in = 1500, out = 500 }, vision-language = { in = 2500, out = 500 }, judge-text = { in = 3000, out = 300 }, judge-vision = { in = 4000, out = 300 }, ocr = { in = 2500, out = 1200 }, transcribe = { in = 2000, out = 600 } }

[backends.local-gpu]
kind = "local"
name = "omarchy RTX 3060 12 GB (the GPU lane)"
order = 0
use = "freely"
leaves = false
watts = 170
usd_per_kwh = 0.30
note = "Free but one card: a job waits for VRAM (scheduler gpu_jobs). ~11 GB usable, the card also drives the desktop."

[backends.local-cpu]
kind = "local"
name = "omarchy CPU (the CPU lane: models with vram_gb = 0)"
order = 0
use = "freely"
leaves = false
watts = 65
usd_per_kwh = 0.30

[backends.agy]
kind = "subscription"
name = "Google AI Pro through Antigravity CLI (agy -p)"
order = 1
use = "freely"
allowance = "agy"
leaves = true
plan_usd_month = 20.0
note = "Official binary only, never proxy its sign-in (Google bans accounts for it). Buckets: Gemini models, Gemini 4 Argon (its own), Claude and GPT models; each a 5 h and a weekly window. Its picture model has a hidden quota (~14 per 5 h) that /usage does not show."

[backends.nvidia-nim]
kind = "api"
name = "NVIDIA NIM API key (integrate.api.nvidia.com)"
order = 1
use = "freely"
allowance = "spend:nim"
leaves = true
note = "Free but rate limited (Jonathan: use as much as you like). Exposes no credit figure: its budget is counted in requests."

[backends.gemini-free]
kind = "api"
name = "Google AI Studio key, free tier"
order = 1
use = "freely"
allowance = "spend:gemini-free"
leaves = true
fallback_for = "agy"
note = "Free but rate limited; agy first for the same model, then this, then the paid key. On the free tier Google may use the inputs to improve its models: keep private material off it."

[backends.codex]
kind = "subscription"
name = "ChatGPT Plus through Codex CLI (codex exec)"
order = 2
use = "sparingly"
allowance = "codex"
min_left = 0.30
leaves = true
plan_usd_month = 20.0
note = "Limited (Jonathan, 2026-11-14: fairly sparingly for now): a larger reserve than agy. Windows: 5 h and weekly."

[backends.gemini-api]
kind = "api"
name = "Google AI Studio key, paid ($10 a month, rolls over on the 1st)"
order = 3
use = "fallback"
allowance = "spend:gemini"
leaves = true
fallback_for = "agy"

[backends.claude-api]
kind = "api"
name = "Claude API key ($100 until 2026-12-08, then monthly)"
order = 3
use = "budget"
allowance = "spend:claude"
leaves = true
note = "Watched closely (Jonathan): the cheapest Claude that passes the eval, and agy's Claude buckets first."

